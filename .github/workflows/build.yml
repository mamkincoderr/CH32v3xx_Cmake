name: Build CH32v3xx_Cmake

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'CMakeLists.txt'
      - 'User/**'
      - 'Core/**'
      - 'Peripheral/**'
      - 'Debug/**'
      - 'Startup/**'
      - 'Ld/**'
      - 'cmake/**'
      - 'build.bat'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        chip: [303, 307]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        run: |
          choco install cmake --version=3.28.0 -y --no-progress
          cmake --version

      - name: Install Ninja
        run: |
          choco install ninja -y --no-progress
          ninja --version

      # GitHub-hosted windows-latest runners do not carry MounRiver Studio 2 /
      # the WCH-patched GCC 15 (riscv32-wch-elf-gcc, custom rv32imafcxw/ilp32f
      # ISA extensions) - it ships only inside the MRS2 IDE installer, and WCH
      # does not publish a standalone redistributable archive for it (their
      # mirrored standalone toolchains only go up to GCC 12). This step fails
      # loudly instead of silently skipping the build, unlike the previous
      # version of this workflow. Real options to make this job actually
      # build: point runs-on at a self-hosted runner that already has MRS2
      # installed (e.g. the maintainer's own dev machine - it has this
      # project's exact toolchain, CMake, Ninja and a WCH-Link probe), or
      # host a redistributable copy of the GCC15 archive somewhere this step
      # can fetch it from (check WCH's licence terms first).
      - name: Locate WCH GCC 15 toolchain
        shell: powershell
        run: |
          $candidates = @(
            "C:\MounRiver\MounRiver_Studio2\resources\app\resources\win32\components\WCH\Toolchain\RISC-V Embedded GCC15\bin",
            "C:\Program Files\MounRiver\MounRiver_Studio2\resources\app\resources\win32\components\WCH\Toolchain\RISC-V Embedded GCC15\bin",
            "C:\Program Files (x86)\MounRiver\MounRiver_Studio2\resources\app\resources\win32\components\WCH\Toolchain\RISC-V Embedded GCC15\bin"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'riscv32-wch-elf-gcc.exe') } | Select-Object -First 1
          if (-not $found) {
            Write-Error "riscv32-wch-elf-gcc.exe not found. See the comment above this step in build.yml for why and what to do."
            exit 1
          }
          Write-Host "Found toolchain: $found"

      - name: Select chip (${{ matrix.chip }}) in User/chip_select.h
        shell: powershell
        run: |
          (Get-Content User\chip_select.h) `
            -replace '#define\s+CH32v3xx_CHIP\s+\d+', '#define CH32v3xx_CHIP   ${{ matrix.chip }}' |
            Set-Content User\chip_select.h
          Select-String -Path User\chip_select.h -Pattern '#define\s+CH32v3xx_CHIP\s+\d+'

      - name: Build
        shell: cmd
        run: build.bat

      - name: Verify artifacts
        shell: powershell
        run: |
          $expected = @('obj\CH32v3xx_Cmake.elf', 'obj\CH32v3xx_Cmake.hex', 'obj\CH32v3xx_Cmake.bin', 'obj\built_as.txt')
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Missing expected output(s): $($missing -join ', ')"
            exit 1
          }
          Get-Content obj\built_as.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: firmware-CH32V${{ matrix.chip }}
          path: |
            obj/CH32v3xx_Cmake.elf
            obj/CH32v3xx_Cmake.hex
            obj/CH32v3xx_Cmake.bin
            obj/CH32v3xx_Cmake.map
            obj/built_as.txt
          if-no-files-found: error
          retention-days: 30
